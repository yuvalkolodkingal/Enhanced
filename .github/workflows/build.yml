# Builds the mod on every push and pull request, runs the GameTests, and publishes the jar as a GitHub Release
# for every push to main (and for every v* tag).
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: ./gradlew build

      - name: Run the GameTests
        run: ./gradlew runGameTestServer

      - name: Name the jar
        id: jar
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            label="$GITHUB_REF_NAME"
          else
            label="${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p dist
          cp "build/libs/enhanced-${version}.jar" "dist/enhanced-${label}.jar"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-${{ steps.jar.outputs.label }}
          path: dist/*.jar
          if-no-files-found: error
    outputs:
      version: ${{ steps.jar.outputs.version }}
      label: ${{ steps.jar.outputs.label }}

  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the jar
        uses: actions/download-artifact@v4
        with:
          name: enhanced-${{ needs.build.outputs.label }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ needs.build.outputs.label }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            title="Enhanced $GITHUB_REF_NAME"
          else
            tag="v${LABEL}"
            title="Enhanced ${VERSION} (build ${GITHUB_RUN_NUMBER})"
          fi
          notes="Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.

          Install: put the jar in the mods folder of a NeoForge 21.1 (Minecraft 1.21.1) instance, on the client and,
          for multiplayer, on the server too. Personal use only: the jar contains a copyrighted song."
          gh release create "$tag" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            --latest
