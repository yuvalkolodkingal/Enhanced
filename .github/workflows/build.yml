# Builds the mod on every push and pull request, runs the GameTests, and publishes the jar as a GitHub Release
# for every push to main (and for every v* tag).
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # (25 for the 26.3 copy's toolchain; the last one listed, 21, is the default)
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the mod
        run: ./gradlew build

      - name: Run the GameTests
        run: ./gradlew runGameTestServer

      - name: Name the jar
        id: jar
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            label="$GITHUB_REF_NAME"
          else
            label="${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p dist
          cp "build/libs/enhanced-${version}.jar" "dist/enhanced-${label}.jar"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Upload the jar
        uses: actions/upload-artifact@v5
        with:
          name: enhanced-${{ steps.jar.outputs.label }}
          path: dist/*.jar
          if-no-files-found: error
    outputs:
      version: ${{ steps.jar.outputs.version }}
      label: ${{ steps.jar.outputs.label }}

  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the jar
        uses: actions/download-artifact@v5
        with:
          name: enhanced-${{ needs.build.outputs.label }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ needs.build.outputs.label }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            title="Enhanced $GITHUB_REF_NAME"
          else
            tag="v${LABEL}"
            title="Enhanced ${VERSION} (build ${GITHUB_RUN_NUMBER})"
          fi
          notes="Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.

          Install: put the jar in the mods folder of a NeoForge 21.1 (Minecraft 1.21.1) instance, on the client and,
          for multiplayer, on the server too."
          gh release create "$tag" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            --latest

  publish:
    # Each new mod_version goes to CurseForge and Modrinth once: the first push to main that builds it. The tag
    # published/<version> marks it as sent. Skipped until the secrets CURSEFORGE_TOKEN / MODRINTH_TOKEN and the
    # variables CURSEFORGE_ID / MODRINTH_ID are set in the repository settings (either pair alone is enough).
    name: Publish to CurseForge and Modrinth
    needs: [build, release]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide
        id: go
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MR_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CF_ID: ${{ vars.CURSEFORGE_ID }}
          MR_ID: ${{ vars.MODRINTH_ID }}
        run: |
          go=true
          if git ls-remote --exit-code --tags origin "refs/tags/published/${VERSION}" >/dev/null; then
            echo "Enhanced ${VERSION} is already published"; go=false
          fi
          cf=false; mr=false
          [ -n "$CF_TOKEN" ] && [ -n "$CF_ID" ] && cf=true
          [ -n "$MR_TOKEN" ] && [ -n "$MR_ID" ] && mr=true
          if [ "$cf" = false ] && [ "$mr" = false ]; then
            echo "::notice::No CurseForge or Modrinth token and project id set: not publishing"; go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "cf=$cf" >> "$GITHUB_OUTPUT"
          echo "mr=$mr" >> "$GITHUB_OUTPUT"
          # this version's changelog
          awk -v h="## What's new in ${VERSION}" '$0==h{on=1;next} on&&/^## /{exit} on' README.md > changelog.txt
          [ -s changelog.txt ] || echo "Enhanced ${VERSION}" > changelog.txt
          cat changelog.txt

      - name: Download the jar
        if: steps.go.outputs.go == 'true'
        uses: actions/download-artifact@v5
        with:
          name: enhanced-${{ needs.build.outputs.label }}
          path: dist

      - name: Upload to CurseForge and Modrinth
        if: steps.go.outputs.go == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.go.outputs.mr == 'true' && vars.MODRINTH_ID || '' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ steps.go.outputs.cf == 'true' && vars.CURSEFORGE_ID || '' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/*.jar
          name: Enhanced ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: release
          changelog-file: changelog.txt
          loaders: neoforge
          game-versions: |
            1.21.1
            1.21.4
            1.21.11
            26.3
          game-version-filter: none
          java: |
            21
          retry-attempts: 2

      - name: Mark the version as published
        if: steps.go.outputs.go == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "published/${VERSION}" "$GITHUB_SHA"
          git push origin "published/${VERSION}"
