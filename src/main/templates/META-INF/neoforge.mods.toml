modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Eilon Kolodkin-Gal (ideas), Yuval Kolodkin-Gal"
description='''
Become one of the Enhanced: Magneto, the Master of Magnetism, or Wanda Maximoff, the Scarlet Witch.
Survive Wanda's Hex and you might come out with powers of your own.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
