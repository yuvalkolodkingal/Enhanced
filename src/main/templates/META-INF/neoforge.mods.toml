modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Eilon Kolodkin-Gal (ideas), Yuval Kolodkin-Gal"
description='''
Become one of the Enhanced: Magneto, the Master of Magnetism; Wanda Maximoff, the Scarlet Witch, and her Hex;
Quicksilver, who slows the world down around him or just outruns it; Vision, the Mind Stone in a synthetic body;
Tommy and Billy, Wanda's sons; Loki, the God of Mischief; or Thor, the God of Thunder, with Mjolnir, Stormbreaker and
the Bifrost.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
