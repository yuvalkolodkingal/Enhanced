modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Eilon Kolodkin-Gal (ideas), Yuval Kolodkin-Gal"
description='''
Become one of the Enhanced: Magneto, the Master of Magnetism; Wanda Maximoff, the Scarlet Witch;
Quicksilver, who runs so fast the world slows down around him; or Vision, the Mind Stone in a synthetic body.
Survive Wanda's Hex and you might come out as Photon.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
