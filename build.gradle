plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTests live in their own source set so they never end up in the mod jar.
// Run them with ./gradlew runGameTestServer (the server exits with an error if a required test fails).
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Port P0: the parity report (build/gametest/<mc>-neoforge.json) and the test filter
            // (./gradlew runGameTestServer -Penhanced.tests=Captain*,FalconTests.redwing*).
            systemProperty 'enhanced.testReport', file('build/gametest').absolutePath
            systemProperty 'enhanced.tests', providers.gradleProperty('enhanced.tests').getOrElse('')
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

// Minecraft + NeoForge for the GameTest source set.
neoForge.addModdingDependenciesTo(sourceSets.gametest)

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // MP3 decoder, so Quicksilver's Walkman can play a song file the player drops into config/enhanced/music.
    // Shipped inside the mod jar (Jar-in-Jar); also on the run classpath in development.
    jarJar(implementation("javazoom:jlayer:1.0.1"))
    additionalRuntimeClasspath "javazoom:jlayer:1.0.1"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ===== port P0 S-A =====
// The common-event annotation processor (processor/, plain Java, never shipped): it writes the registration index of the
// @Subscribe listeners (platform.event.generated) when main compiles, in the order recorded in
// docs/port/listener-order.txt. It is a source set of the root project for now; P1-S makes processor/ a subproject.
sourceSets {
    processor {
        java.srcDirs = ['processor/src/main/java']
        resources.srcDirs = ['processor/src/main/resources']
    }
}
dependencies {
    annotationProcessor sourceSets.processor.output
}
def listenerOrderFile = file('docs/port/listener-order.txt')
tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs.add("-Aenhanced.listenerOrder=${listenerOrderFile.absolutePath}".toString())
    inputs.files(listenerOrderFile).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('listenerOrder')
}
// The recording's path, for the debug command that writes it and the GameTest that reads it; with
// -PrecordListenerOrder a run records its side when loading completes (a client then exits).
// (-PrecordListenerOrder=exit: a server exits too.)
def recordListenerOrder = project.findProperty('recordListenerOrder')
neoForge.runs.configureEach {
    systemProperty 'enhanced.listenerOrder', listenerOrderFile.absolutePath
    if (recordListenerOrder != null) {
        systemProperty 'enhanced.recordListenerOrder', recordListenerOrder == 'exit' ? 'exit' : 'true'
    }
}
// ===== end port P0 S-A =====

// ===== port P0 L8 =====
// The port lint (PLAN2 4.2, gate P0): loader API only where the loader is. It fails the build on
//   neoforge  - a reference to net.neoforged.* in code (imports, qualified names, strings; comments do not count),
//   subscribe - @SubscribeEvent / @EventBusSubscriber (the mod's listeners are @Subscribe on the common events),
//   hidden    - NeoForge extension calls no import shows: getPersistentData() (-> ModAttachments.PERSISTENT_DATA) and
//               hasChannel( (-> the platform's channel check),
// outside platform/neoforge/** (main and gametest: the bridge, the platform implementation and the GameTest adapter)
// and, for neoforge only, the two @Mod entries (Enhanced, client/EnhancedClient). While P0's lanes are in progress the
// files each lane has still to migrate are listed in docs/port/lint/<lane>.txt (one path or glob per line, # comments);
// a lane empties its list (deletes the file) when it is done, so the P0 gate has no list left. A listed file that is
// clean already is reported, so lists only shrink. `./gradlew portLint` alone; `check` (and so `build`) runs it.
abstract class PortLint extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSources()

    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getAllowLists()

    @Internal
    abstract DirectoryProperty getRoot()

    @OutputFile
    abstract RegularFileProperty getReport()

    private static final List<String> LOADER_DIRS = ['src/main/java/com/kolodkingal/enhanced/platform/neoforge/',
                                                     'src/gametest/java/com/kolodkingal/enhanced/platform/neoforge/']
    private static final List<String> MOD_ENTRIES = ['src/main/java/com/kolodkingal/enhanced/Enhanced.java',
                                                     'src/main/java/com/kolodkingal/enhanced/client/EnhancedClient.java']
    private static final Map<String, java.util.regex.Pattern> RULES = [
            neoforge : ~/\bnet\.neoforged\./,
            subscribe: ~/@(SubscribeEvent|EventBusSubscriber)\b/,
            hidden   : ~/\bgetPersistentData\(\s*\)|\.hasChannel\(/,
    ]

    /** The code of a Java file without its comments (string and char literals kept). */
    static String code(String text) {
        StringBuilder out = new StringBuilder(text.length())
        int i = 0
        int n = text.length()
        while (i < n) {
            char c = text.charAt(i)
            char next = i + 1 < n ? text.charAt(i + 1) : (char) 0
            if (c == '/' && next == '/') {
                while (i < n && text.charAt(i) != '\n') i++
            } else if (c == '/' && next == '*') {
                i += 2
                while (i < n && !(text.charAt(i) == '*' && i + 1 < n && text.charAt(i + 1) == '/')) {
                    if (text.charAt(i) == '\n') out.append('\n')
                    i++
                }
                i += 2
            } else if (c == '"' || c == '\'') {
                char quote = c
                out.append(c)
                i++
                while (i < n && text.charAt(i) != quote && text.charAt(i) != '\n') {
                    if (text.charAt(i) == '\\' && i + 1 < n) {
                        out.append(text.charAt(i))
                        i++
                    }
                    out.append(text.charAt(i))
                    i++
                }
                if (i < n) {
                    out.append(text.charAt(i))
                    i++
                }
            } else {
                out.append(c)
                i++
            }
        }
        return out.toString()
    }

    @TaskAction
    void lint() {
        File base = root.get().asFile
        Map<String, List<String>> allowed = new TreeMap<>()     // lane -> its globs
        allowLists.files.findAll { it.isFile() }.sort { it.name }.each { File list ->
            String lane = list.name.replaceFirst(/\.txt$/, '')
            allowed[lane] = list.readLines('UTF-8').collect { it.replaceFirst(/#.*/, '').trim() }.findAll { it }
        }
        Map<String, java.nio.file.PathMatcher> matchers = [:]
        allowed.each { lane, globs -> globs.each { matchers[it] = java.nio.file.FileSystems.default.getPathMatcher("glob:" + it) } }

        List<String> errors = []
        Map<String, Integer> waived = new TreeMap<>()
        Set<String> usedGlobs = new HashSet<>()
        int scanned = 0
        sources.files.sort { it.path }.each { File file ->
            String rel = base.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            if (LOADER_DIRS.any { rel.startsWith(it) }) {
                return
            }
            scanned++
            String text = code(file.getText('UTF-8'))
            List<String> hits = []
            RULES.each { rule, pattern ->
                if (rule == 'neoforge' && MOD_ENTRIES.contains(rel)) {
                    return
                }
                def lines = text.readLines()
                for (int k = 0; k < lines.size(); k++) {
                    if (pattern.matcher(lines[k]).find()) {
                        hits << "${rule} ${rel}:${k + 1}: ${lines[k].trim()}".toString()
                    }
                }
            }
            if (hits.isEmpty()) {
                return
            }
            String glob = matchers.find { g, m -> m.matches(java.nio.file.Paths.get(rel)) }?.key
            if (glob != null) {
                usedGlobs << glob
                String lane = allowed.find { l, gs -> gs.contains(glob) }.key
                waived[lane] = (waived[lane] ?: 0) + 1
            } else {
                errors.addAll(hits)
            }
        }
        List<String> stale = []
        allowed.each { lane, globs -> globs.findAll { !usedGlobs.contains(it) }.each { stale << "${lane}: ${it}".toString() } }

        StringBuilder out = new StringBuilder()
        out.append("Port lint: ${scanned} files outside platform/neoforge; ${errors.size()} new coupling(s); ")
        out.append("allow-listed files still to migrate: ${waived.isEmpty() ? 'none' : waived.collect { l, c -> "$l $c" }.join(', ')}\n")
        if (!stale.isEmpty()) {
            out.append("Clean already, remove from docs/port/lint/ (${stale.size()}):\n")
            stale.each { out.append("  ").append(it).append('\n') }
        }
        errors.each { out.append("  ").append(it).append('\n') }
        report.get().asFile.text = out.toString()
        logger.lifecycle(out.toString().trim())
        if (!errors.isEmpty()) {
            throw new GradleException("Port lint: ${errors.size()} reference(s) to the loader outside platform/neoforge/** "
                    + "(see above; the platform API replaces them, PLAN2 3.3). Report: ${report.get().asFile}")
        }
    }
}
def portLint = tasks.register('portLint', PortLint) {
    group = 'verification'
    description = 'Fails on NeoForge API outside platform/neoforge/** and the @Mod entries (port P0).'
    root = layout.projectDirectory
    sources.from(fileTree('src/main/java') { include '**/*.java' }, fileTree('src/gametest/java') { include '**/*.java' })
    allowLists.from(fileTree('docs/port/lint') { include '*.txt' })
    report = layout.buildDirectory.file('reports/portLint.txt')
}
tasks.named('check') { dependsOn portLint }
// ===== end port P0 L8 =====
