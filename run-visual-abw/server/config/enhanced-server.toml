[magneto]
	#Magneto's flying speed (Creative flight is 0.05).
	# Default: 0.075
	# Range: 0.01 ~ 0.5
	flightSpeed = 0.075
	#How far away (blocks) every telekinesis (Magneto, Wanda, Billy, the Phoenix) can grab a target.
	# Default: 32
	# Range: 4 ~ 128
	telekinesisRange = 32
	#Launch speed (blocks per tick) of a telekinetic throw.
	# Default: 2.6
	# Range: 0.5 ~ 6.0
	throwSpeed = 2.6
	#Damage of one iron shrapnel shard.
	# Default: 4.0
	# Range: 0.0 ~ 100.0
	shrapnelDamage = 4.0
	#How many creatures a single shard can pierce through.
	# Default: 3
	# Range: 1 ~ 16
	shrapnelPierce = 3
	#Ticks between shards while the Shrapnel Storm is held (2 = 10 shards/second).
	# Default: 2
	# Range: 1 ~ 20
	shrapnelFireInterval = 2
	#Range of Armor & Weapon Strip.
	# Default: 32
	# Range: 4 ~ 128
	disarmRange = 32
	#Cooldown of Armor & Weapon Strip, in ticks.
	# Default: 60
	# Range: 0 ~ 6000
	disarmCooldown = 60
	#Chance that a metal projectile caught by the Magnetic Shield flies back at the shooter (otherwise it drops).
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	shieldReflectChance = 0.5
	#How far away (blocks) Magneto can tear a metal block out of the ground with R.
	# Default: 24
	# Range: 2 ~ 128
	blockLiftRange = 24
	#Hardest metal block Magneto can lift with R (iron block = 5, ancient debris = 30, block of netherite = 50).
	# Default: 50.0
	# Range: 0.0 ~ 100.0
	blockLiftMaxHardness = 50.0
	#Radius (blocks) of the Magnetic Pull (Sneak + R holding nothing): a sphere round where he pressed; ores come
	#through rock.
	# Default: 8
	# Range: 2 ~ 32
	pullRadius = 8
	#The most things (blocks, items, creatures) one pull takes; the nearest first.
	# Default: 64
	# Range: 1 ~ 512
	pullMaxTargets = 64
	#Things the pull takes each tick (2 = 40 a second).
	# Default: 2
	# Range: 1 ~ 64
	pullPerTick = 2
	#Blocks the pull looks at in one tick while it searches (a big radius searches over a few ticks).
	# Default: 8192
	# Range: 512 ~ 131072
	pullScanPerTick = 8192
	#Ticks before Magneto can pull again (100 = 5 seconds). Starts only if the pull affected something (took,
	#tugged, dissolved, crumbled, scattered).
	# Default: 100
	# Range: 0 ~ 6000
	pullCooldown = 100
	#Hunger one pull costs (4 = one hunger point). Nothing if the pull affected nothing.
	# Default: 4.0
	# Range: 0.0 ~ 40.0
	pullExhaustion = 4.0
	#The pull also takes metal blocks and fixtures people build with (rails, doors, lanterns, anvils, hoppers,
	#pistons...), whole: never one that holds items, never an extended or powered piston. Off: only ores, raw-metal
	#blocks, loose metal and creatures' gear.
	pullTakesBuiltMetal = true
	#Built metal comes only if Magneto can see it (a clear line from his eyes). Ores and raw-metal blocks
	#always come through rock. Off: built metal also comes through walls.
	pullBuiltNeedsSight = true
	#Built metal comes only from within this cone (degrees) round where he looks, so he turns round to pull the
	#rest; 360: all round him. Ores, raw-metal blocks, loose metal, gear and carts come from all round.
	# Default: 120
	# Range: 0 ~ 360
	pullBuiltCone = 120
	#The pull also takes the metal out of chests and other containers, item frames and armour stands he can
	#see (claims are asked; never a villager's work block); the container, frame or stand stays. Off: what is
	#stored stays where it is.
	pullFromStorage = false
	#The pull tears metal armour and weapons off hostile creatures in reach.
	pullTakesGear = true
	#With PvP on, the pull also acts on players Magneto can see: one metal piece into his inventory, an Iron
	#Spider's nanites scattered, or a metal body tugged, once per player per pullPlayerGraceTicks. Off: the pull never
	#touches a player.
	pullTakesPlayerGear = true
	#The player's piece drops at that player's feet instead of flying into Magneto's inventory.
	pullPlayerGearToFeet = false
	#After the pull acted on a player, no pull acts on that player again for this many ticks (200 = 10 seconds).
	# Default: 200
	# Range: 0 ~ 6000
	pullPlayerGraceTicks = 200
	#Every telekinesis (Magneto, Wanda, Billy, the Phoenix): for this many ticks after one of the hero's grips
	#ends, Sneak + the key with nothing held does nothing (so a late "put it down" press is not a pull or a torn-out
	#block).
	# Default: 20
	# Range: 0 ~ 100
	telekinesisSneakGraceTicks = 20
	#After a pull that found nothing, another press does nothing for this many ticks.
	# Default: 10
	# Range: 0 ~ 100
	pullRetryTicks = 10
	#The pull takes the netherite scrap out of ancient debris (the debris becomes netherrack).
	pullAncientDebris = true
	#How hard the pull tugs Iron Golems and other metal bodies toward him (blocks per tick at most; 0 = it leaves
	#them where they are).
	# Default: 1.0
	# Range: 0.0 ~ 3.0
	pullTug = 1.0
	#Every telekinesis (Magneto, Wanda, Billy, the Phoenix): a player, or a creature another player owns (a
	#pet, a drone, the Vision of a Hex), let go or thrown by someone who may not hurt them (PvP off, a teammate)
	#takes no fall, wall or slam damage until it lands.
	telekinesisSparesFriends = true
	#Every telekinesis: after letting go of a player, the same hero cannot grip that player again for this
	#many ticks (60 = 3 seconds).
	# Default: 60
	# Range: 0 ~ 1200
	telekinesisPlayerRegripTicks = 60

