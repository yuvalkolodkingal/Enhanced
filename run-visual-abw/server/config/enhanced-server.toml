[build_magic]
	#Build Magic exists on this server.
	enabled = true
	#Only operators (permission level 2) may use it.
	operatorsOnly = false
	#Off: spells conjure their blocks from magic. On: in Survival they take one item per block from the inventory,
	#vanished blocks go into it, and undo gives back. Creative never pays.
	requireMaterials = false
	#Milliseconds of each server tick that all spells together may use (half while the server is slow).
	# Default: 8
	# Range: 1 ~ 40
	millisPerTick = 8
	#The most block writes all spells together may make in one tick (reads count a quarter).
	#Every changed block is also sent to each player who sees it: lower this on a server with a slow upload.
	# Default: 20000
	# Range: 256 ~ 200000
	blocksPerTick = 20000
	#The most 16x16x16 sections spells may start changing in one tick (bounds what clients download).
	# Default: 16
	# Range: 1 ~ 256
	sectionsPerTick = 16
	#A spell takes at least this long, so it is seen growing.
	# Default: 10
	# Range: 1 ~ 100
	minSpellTicks = 10
	#Spells of one Scarlet Witch that may wait behind the one at work (Billy has none).
	# Default: 4
	# Range: 0 ~ 16
	maxQueued = 4
	#Spells working or waiting on the whole server.
	# Default: 16
	# Range: 1 ~ 256
	maxSpellsTotal = 16
	#A spell that removes or replaces more existing blocks than this needs the right button held
	#(0: every such spell).
	# Default: 64
	# Range: 0 ~ 1000000
	holdToConfirmBlocks = 64
	#How long that hold is.
	# Default: 20
	# Range: 0 ~ 100
	holdToConfirmTicks = 20
	#A spell over this many blocks needs the longer hold.
	# Default: 1000000
	# Range: > 1000
	hugeSpellBlocks = 1000000
	#How long that hold is.
	# Default: 40
	# Range: 0 ~ 200
	hugeHoldTicks = 40
	#No Build Magic spell and no Magnetic Pull changes a block in the arena of any running boss fight,
	#Thanos's included. Off: only the protected arenas (and always the island in the sky). One switch for both,
	#so the two never disagree about where they may change a block.
	allArenasProtected = true
	#Inside a Hex, only its owner and the players she allowed may build with Build Magic or pull with the
	#Magnetic Pull. (Telekinesis on one block asks the claims as a hand does, and is not covered.)
	hexIsAClaim = false
	#A container that holds items in a spell's way: SKIP leaves it as it is, SPILL spills its items on the spot.
	#A Move always carries it.
	#Allowed Values: SKIP, SPILL
	fullContainers = "SKIP"
	#Creatures inside new blocks are lifted on top (other players only with PvP on; never a creature Mjolnir
	#pins). Off: their cells stay empty.
	liftCreatures = true
	#Move takes the creatures, frames, paintings and armour stands inside along (not one Mjolnir pins).
	moveCarriesCreatures = true
	#Sand, gravel and other falling blocks a spell places in the air stay where magic put them until
	#something touches them.
	holdGravityBlocks = true
	#Ask claim mods (the break and place events) for every block; off: once per 16x16x16 section.
	postEventsPerBlock = true
	#Blocks the server checks to preview a spell (more: a spread sample); 0: no marks.
	# Default: 8192
	# Range: 0 ~ 65536
	previewChecks = 8192
	#The undo history and the pocket are kept on disk with the world.
	undoSurvivesRestart = true
	#Memory (MiB) one player's undo history may use; past it the oldest spells leave memory (they stay on disk).
	# Default: 64
	# Range: 4 ~ 4096
	undoMemoryMb = 64
	#Disk (MiB) one player's undo history may use; past it the oldest spells are forgotten.
	# Default: 512
	# Range: 0 ~ 1048576
	undoDiskMb = 512
	#Memory (MiB) all undo histories together may use; past it, the spells of the player using the most
	#leave memory (they stay on disk).
	# Default: 512
	# Range: 64 ~ 65536
	serverUndoMemoryMb = 512
	#Disk (MiB) all undo histories together may use; past it the oldest spell of the player using the most
	#is forgotten.
	# Default: 4096
	# Range: 0 ~ 4194304
	serverUndoDiskMb = 4096
	#The biggest copy (compressed, MiB) one player may hold.
	# Default: 64
	# Range: 1 ~ 4096
	pocketMaxMb = 64
	#When the server stops, the spells still working are finished while their blocks left add up to at most
	#this; the largest are stopped first (and can be undone).
	# Default: 200000
	# Range: 0 ~ 10000000
	finishOnStopBlocks = 200000
	#Chunks one spell keeps loaded at once.
	# Default: 256
	# Range: 16 ~ 4096
	maxTicketChunks = 256
	#Build messages a client may send per second; more are dropped.
	# Default: 40
	# Range: 5 ~ 200
	maxRequestsPerSecond = 40
	#Dimensions where Build Magic does not work (ids, e.g. "minecraft:the_end").
	deniedDimensions = []

