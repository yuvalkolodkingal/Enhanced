[boss]
	#How many boss fights may run at once on the whole server (Ultron, Thanos and Apocalypse together).
	#A ritual that would start another one is refused.
	# Default: 1
	# Range: 1 ~ 8
	maxActiveFights = 1
	#When every fighter is dead, the fight ends after this many seconds (the boss leaves, nobody is rewarded).
	# Default: 15
	# Range: 1 ~ 600
	wipeSeconds = 15
	#When no fighter has been near the boss for this many seconds, the fight ends and the boss leaves.
	# Default: 90
	# Range: 10 ~ 3600
	abandonSeconds = 90
	#No fight lasts longer than this: after it the boss leaves (a fail-safe against a stuck fight).
	# Default: 25
	# Range: 1 ~ 240
	maxFightMinutes = 25
	#A fighter earns the reward only after being in the fight at least this many seconds
	#(and having hurt the boss; the player who lands the last blow earns it whatever the time).
	# Default: 60
	# Range: 0 ~ 3600
	rewardMinSeconds = 60
	#If true, Creative players who fought also earn the reward. They never do by default.
	creativeGetsReward = false
	#Experience points every rewarded fighter gets when the boss falls.
	# Default: 1500
	# Range: 0 ~ 100000
	xpRewardPerPlayer = 1500
	#If true (the default), the server is told in chat when a boss is called and when it falls.
	announceFights = true
	#If true (the default), blocks in a boss's arena can't be broken, placed, burned or blown up while the
	#fight lasts, so the world is the same when it ends. (Thanos's arena is never protected.)
	#The floating island of Ultron's fight is always protected: it is a copy of the ground, not the world.
	protectArena = true
	#Multiplies the health and the damage of every boss (1.0 = as designed, 0.5 = half as hard).
	# Default: 1.0
	# Range: 0.1 ~ 10.0
	difficultyScale = 1.0
	#Telekinesis (Wanda, Billy, the Phoenix, Magneto) can take hold of Ultron, Thanos and Apocalypse, as
	#bosses: for a short time, then they break free. Off: they cannot be held at all ("too powerful to lift", as in
	#3.0); Wanda's rip of Ultron's heart still works.
	telekinesisHoldsBosses = true
	#Telekinesis can take hold of the Wither, the Warden and the Elder Guardian, as bosses: for a short time,
	#then they break free (the Ender Dragon is too vast to hold). Off: they are "too powerful to lift".
	telekinesisHoldsVanillaBosses = true
	#How long telekinesis holds the Wither, the Warden or the Elder Guardian before he breaks free (before the
	#hero's factor, billyHoldFactor for Billy; Magneto holds none of the three, they wear no metal).
	# Default: 60
	# Range: 10 ~ 600
	vanillaHoldTicks = 60
	#Billy and the Phoenix (and Magneto, for metal) can catch Thanos's sword, meteors and orbs, and what they
	#throw back is theirs (Ultron's bolts and Apocalypse's lances then hit their own side). Off: Thanos's shots
	#cannot be caught, and a caught bolt or lance stays the boss's (as in 3.0).
	telekinesisCatchesBossShots = true
	#After a boss breaks free, is let go or lands from a throw, nobody can take hold of him again for this many ticks.
	# Default: 240
	# Range: 0 ~ 2400
	regripTicks = 240
	#A boss thrown by telekinesis does nothing for at most this many ticks of his flight (his regrip time
	#starts after it).
	# Default: 20
	# Range: 0 ~ 40
	thrownStillTicks = 20
	#Billy holds a boss this many times as long as Wanda (the bosses only: Thanos's sword he holds
	#thanos_boss.swordHoldTicks, as the Phoenix does).
	# Default: 0.5
	# Range: 0.1 ~ 2.0
	billyHoldFactor = 0.5
	#Magneto holds a metal boss, and every metal thing of a fight (Thanos's sword), this many times as long
	#as Wanda.
	# Default: 1.5
	# Range: 0.1 ~ 3.0
	magnetoHoldFactor = 1.5
	#Block telekinesis can borrow the blocks of a protected arena: the holes mend, a borrowed block crumbles
	#after a while, and everything goes back when the fight ends. Off: lifting is refused in the arenas (as in 3.0).
	lendArenaBlocks = true
	#Ticks after which the hole a borrowed block left mends.
	# Default: 100
	# Range: 20 ~ 1200
	arenaMendTicks = 100
	#How long (ticks) a borrowed block that is set down stands before it crumbles.
	# Default: 100
	# Range: 20 ~ 2400
	borrowedBlockTicks = 100
	#At most this many borrowed blocks of one player stand at once; one more set down crumbles at once
	#(0: every borrowed block crumbles when it is set down).
	# Default: 3
	# Range: 0 ~ 48
	maxStandingPerPlayer = 3
	#At most this many borrowed blocks (held, flying or standing) per fight.
	# Default: 48
	# Range: 1 ~ 512
	maxBorrowedBlocks = 48

