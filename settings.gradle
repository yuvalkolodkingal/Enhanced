pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// The copies of the mod for the Minecraft versions after 1.21.1 (docs/MULTIVERSION.md).
include ':v1_21_4'
project(':v1_21_4').projectDir = file('versions/1.21.4')
include ':v1_21_11'
project(':v1_21_11').projectDir = file('versions/1.21.11')
// (26.3: a Java 25 toolchain for this copy only; its classes are Java 21 classes, versions/26.3/build.gradle)
include ':v26_3'
project(':v26_3').projectDir = file('versions/26.3')
// (copies still being ported are built only when asked: ./gradlew -Pwip=1.21.5 :v1_21_5:compileJava; 1.21.5 is not
// shipped: its rules are a step on the way to 1.21.11, whose copy is built from 1.21.4's, 1.21.5's and its own)
def wip = (startParameter.projectProperties.get('wip') ?: '').split(',') as List
['1.21.5'].each { v ->
    if (wip.contains(v)) {
        def name = ':v' + v.replace('.', '_')
        include name
        project(name).projectDir = file('versions/' + v)
    }
}
