// Enhanced's copy for Minecraft 1.21.4: the shared sources (../../src/main/java) through Preprocess, compiled
// against NeoForge 21.4. The root project puts its classes into the one jar (docs/MULTIVERSION.md).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def mc = '1.21.4'
def copySuffix = 'v1_21_4'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def preprocess = tasks.register('preprocess', Preprocess) {
    source = rootProject.file('src/main/java')
    target = layout.buildDirectory.dir('preprocessed/java')
    overlays.from(file('src/main/java'))
    renames.from(file('renames.txt'))
    minecraft = mc
    suffix = copySuffix
    basePackage = 'com.kolodkingal.enhanced'
}
sourceSets.main.java.srcDirs = [preprocess.map { it.target }]

neoForge {
    version = '21.4.161'
}

repositories {
    mavenCentral()
}

dependencies {
    // the @Subscribe registration index, as for 1.21.1 (the root's processor; listener order from docs/port)
    annotationProcessor files(rootProject.layout.buildDirectory.dir('classes/java/processor'),
            rootProject.layout.buildDirectory.dir('resources/processor'))
    implementation 'javazoom:jlayer:1.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '100000',
            "-Aenhanced.listenerOrder=${rootProject.file('docs/port/listener-order.txt').absolutePath}".toString(),
            '-Aenhanced.basePackage=com.kolodkingal.enhanced.v1_21_4'])
    dependsOn(':processorClasses')
}
